# 仓库级 Codex 权限配置
# 继承内置 :workspace（工作区可写、.codex/.git 默认只读），
# 这里仅放开 .git 写入，git add/commit 无需再越权；
# 网络只放行力扣接口与本地 cookie 读取，其余仍受沙箱限制。

default_permissions = "lc-repo"

[permissions.lc-repo]
extends = ":workspace"

[permissions.lc-repo.filesystem.":workspace_roots"]
".git" = "write"

[permissions.lc-repo.network]
enabled = true

[permissions.lc-repo.network.domains]
"**.leetcode.cn" = "allow"
"127.0.0.1" = "allow"
"localhost" = "allow"
